name: OncoForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compile
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke tests
        run: |
          python run_oncoforge.py list-profiles
          python run_oncoforge.py profile-info --profile melanoma_cutaneous
          python run_oncoforge.py recommend-cocktail --profile melanoma_cutaneous
          python run_oncoforge.py qsa-plan --profile melanoma_cutaneous --json outputs/reports/qsa_plan.json
          python run_oncoforge.py portal-session --profile melanoma_cutaneous --steps 5 --healthy 20 --cancer 6 --json outputs/portal/web_payload.json
          python run_oncoforge.py target-forge --input examples/target_forge_synthetic.json --output outputs/target_forge/ci-report.json --no-qsa
          python run_oncoforge.py serve-api --help
